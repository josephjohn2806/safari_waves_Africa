<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maloba Horizon Safari | Kenya, Zanzibar & Uganda Holidays</title>
<meta name="description" content="Affordable family holidays, beach vacations, safaris and group travel across Kenya, Zanzibar and Uganda. Creating unforgettable East African experiences.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#26361F;
    --navy-deep:#152014;
    --navy-soft:#37492D;
    --gold:#A69870;
    --gold-light:#D3C6A4;
    --gold-deep:#6D6A55;
    --sand:#F7F1E4;
    --sand-deep:#EEE3CB;
    --cream:#FBF8F1;
    --ink:#231C14;
    --ink-soft:#6B6153;
    --white:#FFFFFF;
    --line:#E4D8BC;
    --green:#1F9D6C;
    --wa:#25D366;
    --radius:16px;
    --radius-lg:22px;
    --wrap:1180px;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    font-family:'Montserrat',sans-serif;
    color:var(--ink);
    background:var(--white);
    -webkit-font-smoothing:antialiased;
  }
  img{max-width:100%;display:block;}
  a{color:inherit;text-decoration:none;}
  ul{margin:0;padding:0;list-style:none;}
  h1,h2,h3{font-family:'Montserrat',sans-serif;font-weight:700;margin:0;line-height:1.14;color:var(--navy);}
  p{margin:0;}
  .wrap{max-width:var(--wrap);margin:0 auto;padding:0 22px;}
  section{padding:68px 0;}
  .eyebrow{
    display:inline-flex;align-items:center;gap:8px;
    font-size:12.5px;font-weight:700;color:var(--gold-deep);
    letter-spacing:2.2px;
    font-family:'Montserrat',sans-serif;
    padding-bottom:2px;
  }
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    padding:15px 26px;border-radius:99px;font-weight:700;font-size:13.5px;
    letter-spacing:1px;
    border:1.5px solid transparent;cursor:pointer;transition:transform .15s ease, box-shadow .15s ease, background .15s ease;
    white-space:nowrap;
  }
  .btn:active{transform:scale(.97);}
  .btn-gold{background:var(--gold);color:var(--navy-deep);}
  .btn-gold:hover{background:var(--gold-light);}
  .btn-outline{background:transparent;color:var(--white);border-color:rgba(255,255,255,.55);}
  .btn-outline:hover{background:rgba(255,255,255,.12);}
  .btn-navy{background:var(--navy);color:var(--white);}
  .btn-navy:hover{background:var(--navy-deep);}
  .section-head{max-width:600px;margin-bottom:36px;}
  .section-head.center{margin-left:auto;margin-right:auto;text-align:center;}
  .section-head .eyebrow{margin-bottom:14px;}
  .section-head h2{font-size:clamp(30px,4.2vw,42px);}
  .section-head p{margin-top:14px;color:var(--ink-soft);font-size:15.5px;line-height:1.65;}

  /* ---------- Top utility bar ---------- */
  .topbar{
    background:var(--navy-deep);color:#C9BEA9;font-size:12.5px;
    padding:9px 0;
  }
  .topbar .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;}
  .topbar-status{display:flex;align-items:center;gap:7px;}
  .dot{width:7px;height:7px;border-radius:50%;background:#5FD48A;box-shadow:0 0 0 3px rgba(95,212,138,.25);}
  .topbar-links{display:flex;align-items:center;gap:16px;}
  .topbar-links a{display:flex;align-items:center;gap:6px;color:#C9BEA9;}
  .topbar-links svg{width:14px;height:14px;stroke:#C9BEA9;}
  @media (max-width:620px){ .topbar-links span.hide-mobile{display:none;} }

  /* ---------- Header ---------- */
  .site-header{
    position:sticky;top:0;z-index:60;
    background:var(--navy);
    border-bottom:1px solid rgba(255,255,255,.07);
  }
  .site-header .wrap{display:flex;align-items:center;justify-content:space-between;padding-top:16px;padding-bottom:16px;gap:16px;}
  .brand{display:flex;align-items:center;gap:12px;}
  .brand-mark{width:44px;height:44px;flex:none;}
  .brand-mark svg{width:100%;height:100%;}
  .brand-mark img{width:100%;height:100%;object-fit:contain;}
  .brand-word{line-height:1.18;}
  .brand-word .b1{font-family:'Montserrat',sans-serif;font-weight:700;font-size:22px;color:var(--white);letter-spacing:.3px;}
  .brand-word .b1 span{color:var(--gold);}
  .brand-word .b2{font-size:10px;letter-spacing:2.8px;color:#A79A82;margin-top:3px;text-transform:uppercase;}
  .nav{display:none;}
  .nav ul{display:flex;align-items:center;gap:30px;}
  .nav a{color:#EFE9DC;font-size:13.5px;font-weight:600;letter-spacing:.4px;}
  .nav a:hover{color:var(--gold);}
  .header-actions{display:flex;align-items:center;gap:10px;}
  .icon-btn{
    width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.14);
    display:flex;align-items:center;justify-content:center;cursor:pointer;
  }
  .icon-btn svg{width:19px;height:19px;stroke:var(--gold);}
  .header-actions .btn-gold{display:none;}
  @media (min-width:900px){
    .nav{display:block;}
    .header-actions .btn-gold{display:inline-flex;}
    #hamburgerBtn{display:none;}
  }

  /* mobile nav drawer */
  .mobile-nav{
    position:fixed;inset:0;background:var(--navy-deep);z-index:100;
    transform:translateX(100%);transition:transform .3s ease;
    overflow-y:auto;
  }
  .mobile-nav.open{transform:translateX(0);}
  .mobile-nav-top{display:flex;justify-content:flex-end;padding:18px 20px;}
  .mobile-nav-top button{background:none;border:none;cursor:pointer;}
  .mobile-nav-top svg{width:26px;height:26px;stroke:#fff;}
  .mobile-nav ul{padding:6px 26px 30px;display:flex;flex-direction:column;}
  .mobile-nav li{border-bottom:1px solid rgba(255,255,255,.08);}
  .mobile-nav a{display:block;padding:17px 2px;font-size:19px;font-weight:700;color:#F1EADC;font-family:'Montserrat',sans-serif;}
  .mobile-nav .mn-cta{padding:6px 26px 34px;}
  .mn-cta .btn{white-space:normal;text-align:center;line-height:1.3;}

  /* ---------- Hero (rotating slideshow, 13 slides) ---------- */
  .hero{position:relative;padding:0;overflow:hidden;color:#fff;}
  .hero-media{position:relative;min-height:660px;display:flex;align-items:flex-end;}
  .hero-slide{
    position:absolute;inset:0;opacity:0;
    animation:heroCycle 78s infinite;
  }
  .hero-slide img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0;
    animation:kenburns 78s ease-in-out infinite;}
  .hero-slide:nth-child(1){animation-delay:0s;}
  .hero-slide:nth-child(2){animation-delay:6s;}
  .hero-slide:nth-child(3){animation-delay:12s;}
  .hero-slide:nth-child(4){animation-delay:18s;}
  .hero-slide:nth-child(5){animation-delay:24s;}
  .hero-slide:nth-child(6){animation-delay:30s;}
  .hero-slide:nth-child(7){animation-delay:36s;}
  .hero-slide:nth-child(8){animation-delay:42s;}
  .hero-slide:nth-child(9){animation-delay:48s;}
  .hero-slide:nth-child(10){animation-delay:54s;}
  .hero-slide:nth-child(11){animation-delay:60s;}
  .hero-slide:nth-child(12){animation-delay:66s;}
  .hero-slide:nth-child(13){animation-delay:72s;}
  @keyframes heroCycle{
    0%{opacity:0;}
    0.92%{opacity:1;}
    6.92%{opacity:1;}
    8.31%{opacity:0;}
    100%{opacity:0;}
  }
  @keyframes kenburns{from{transform:scale(1.06);}to{transform:scale(1.16);}}
  .hero-overlay{
    position:absolute;inset:0;z-index:1;
    background:linear-gradient(180deg, rgba(16,11,7,.5) 0%, rgba(16,11,7,.55) 42%, rgba(16,11,7,.94) 100%);
  }
  .hero-content{position:relative;z-index:2;padding:96px 0 46px;width:100%;}
  .hero-content .wrap{max-width:720px;}
  .hero-pin{
    display:inline-flex;align-items:center;gap:9px;
    font-family:'Montserrat',sans-serif;font-size:13px;font-weight:600;letter-spacing:3px;
    color:#E7DCC5;margin-bottom:20px;
  }
  .hero-pin svg{width:14px;height:14px;stroke:var(--gold);}
  .hero-headlines{position:relative;min-height:150px;}
  @media(max-width:640px){.hero-headlines{min-height:190px;}}
  .hero-h{position:absolute;inset:0;opacity:0;animation:textCycle 78s infinite;}
  .hero-h:nth-child(1){animation-delay:0s;}
  .hero-h:nth-child(2){animation-delay:6s;}
  .hero-h:nth-child(3){animation-delay:12s;}
  .hero-h:nth-child(4){animation-delay:18s;}
  .hero-h:nth-child(5){animation-delay:24s;}
  .hero-h:nth-child(6){animation-delay:30s;}
  .hero-h:nth-child(7){animation-delay:36s;}
  .hero-h:nth-child(8){animation-delay:42s;}
  .hero-h:nth-child(9){animation-delay:48s;}
  .hero-h:nth-child(10){animation-delay:54s;}
  .hero-h:nth-child(11){animation-delay:60s;}
  .hero-h:nth-child(12){animation-delay:66s;}
  .hero-h:nth-child(13){animation-delay:72s;}
  @keyframes textCycle{
    0%{opacity:0;transform:translateY(8px);}
    0.92%{opacity:1;transform:translateY(0);}
    6.92%{opacity:1;transform:translateY(0);}
    8.31%{opacity:0;transform:translateY(-8px);}
    100%{opacity:0;}
  }
  .hero h1{font-size:clamp(34px,6vw,54px);color:#fff;font-weight:800;}
  .hero-sub{margin-top:16px;font-size:16px;line-height:1.65;color:#DCD2BE;max-width:540px;}
  .hero-ctas{display:flex;flex-wrap:wrap;gap:12px;margin-top:186px;position:relative;z-index:3;}
  @media(max-width:640px){.hero-ctas{margin-top:220px;}}
  .hero-search{
    margin-top:32px;background:#fff;border-radius:99px;padding:8px;
    display:flex;align-items:center;gap:10px;max-width:560px;
    box-shadow:0 18px 40px rgba(0,0,0,.28);
  }
  .hero-search svg{width:18px;height:18px;stroke:var(--ink-soft);flex:none;margin-left:10px;}
  .hero-search input{
    border:none;outline:none;flex:1;font-family:'Montserrat',sans-serif;font-size:14.5px;color:var(--ink);
    background:transparent;min-width:0;
  }
  .hero-search button{
    flex:none;background:var(--gold);color:var(--navy-deep);border:none;border-radius:99px;
    padding:13px 22px;font-weight:700;font-size:13.5px;display:flex;align-items:center;gap:7px;cursor:pointer;
  }
  .hero-search button:hover{background:var(--gold-light);}
  .hero-search button svg{width:14px;height:14px;stroke:var(--navy-deep);margin:0;}
  .hero-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:36px;padding-top:26px;border-top:1px solid rgba(255,255,255,.18);}
  .hero-stat{display:flex;flex-direction:column;gap:5px;}
  .hero-stat b{font-family:'Montserrat',sans-serif;font-size:19px;color:#fff;font-weight:700;}
  .hero-stat span{font-size:12px;color:#B9AD95;letter-spacing:.4px;}
  @media (max-width:560px){ .hero-stats{grid-template-columns:1fr;} .hero-ctas{margin-top:210px;} }

  /* ---------- Country strip ---------- */
  .flagstrip{background:var(--sand);border-bottom:1px solid var(--line);}
  .flagstrip .wrap{display:flex;flex-wrap:wrap;gap:10px 30px;align-items:center;justify-content:center;padding:16px 22px;}
  .flagstrip .fs-item{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;color:var(--navy);letter-spacing:.6px;}
  .flagstrip .flag{font-size:18px;}
  .flagstrip .fs-sep{color:var(--line);}

  /* ---------- Browse by experience ---------- */
  .experience{background:var(--cream);}
  .exp-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;}
  @media(min-width:760px){ .exp-grid{grid-template-columns:repeat(4,1fr);} }
  .exp-card{
    position:relative;border-radius:var(--radius);overflow:hidden;aspect-ratio:3/3.6;
    display:flex;align-items:flex-end;cursor:pointer;border:none;padding:0;background:none;text-align:left;
  }
  .exp-card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .5s ease;}
  .exp-card:hover img{transform:scale(1.06);}
  .exp-card::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(16,11,7,0) 40%,rgba(16,11,7,.85) 100%);}
  .exp-info{position:relative;z-index:2;padding:16px;color:#fff;}
  .exp-info h3{font-family:'Montserrat',sans-serif;font-size:17px;color:#fff;font-weight:700;line-height:1.2;}
  .exp-info span{display:block;margin-top:5px;font-size:11.5px;color:#DCD2BE;line-height:1.4;}

  /* ---------- Filter pills ---------- */
  .filterbar{padding:6px 0 0;}
  .filterbar .wrap{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;}
  .pill{
    flex:none;padding:11px 20px;border-radius:99px;border:1.5px solid var(--line);
    font-size:13px;font-weight:700;color:var(--ink-soft);background:#fff;cursor:pointer;
    letter-spacing:.3px;
  }
  .pill.active{background:var(--navy);border-color:var(--navy);color:#fff;}

  /* ---------- Packages (large image cards, matching reference tour cards) ---------- */
  .packages{padding-top:30px;background:var(--white);}
  .pkg-count{font-size:13.5px;color:var(--ink-soft);margin:20px 0 24px;font-weight:600;}
  .pkg-count b{color:var(--navy);}
  .pkg-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:24px;}
  .pkg-card{
    position:relative;border-radius:var(--radius-lg);overflow:hidden;
    min-height:430px;display:flex;flex-direction:column;justify-content:flex-end;
    box-shadow:0 10px 30px rgba(20,15,8,.14);
  }
  .pkg-card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .6s ease;}
  .pkg-card:hover img{transform:scale(1.05);}
  .pkg-card::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(16,11,7,0) 24%,rgba(16,11,7,.55) 58%,rgba(16,11,7,.92) 100%);}
  .pkg-badge{
    position:absolute;top:16px;left:16px;z-index:3;background:var(--gold-light);color:var(--navy-deep);
    font-size:11px;font-weight:800;padding:7px 14px;border-radius:99px;letter-spacing:.5px;
  }
  .pkg-body{position:relative;z-index:2;padding:22px;display:flex;flex-direction:column;gap:9px;color:#fff;}
  .pkg-loc{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--gold-light);font-weight:700;letter-spacing:1.5px;}
  .pkg-loc svg{width:12px;height:12px;stroke:var(--gold-light);}
  .pkg-title{font-family:'Montserrat',sans-serif;font-size:22px;color:#fff;font-weight:700;line-height:1.2;}
  .pkg-includes{font-size:13px;color:#D8CDB8;line-height:1.55;}
  .pkg-foot{margin-top:6px;padding-top:14px;border-top:1px solid rgba(255,255,255,.22);display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .pkg-duration{font-size:12px;font-weight:700;color:#D8CDB8;letter-spacing:.6px;}
  .pkg-price{font-size:12px;color:#D8CDB8;text-align:right;}
  .pkg-price b{font-family:'Montserrat',sans-serif;font-size:19px;color:var(--gold-light);font-weight:700;}
  .pkg-link{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:#fff;letter-spacing:.6px;margin-top:2px;}
  .pkg-link svg{width:13px;height:13px;stroke:#fff;transition:transform .15s ease;}
  .pkg-card:hover .pkg-link svg{transform:translateX(3px);}

  /* ---------- About / Mission ---------- */
  .about{background:var(--navy);color:#fff;}
  .about-grid{display:grid;grid-template-columns:1fr;gap:40px;align-items:start;}
  @media (min-width:880px){ .about-grid{grid-template-columns:1fr 1fr;} }
  .about .eyebrow{color:var(--gold);}
  .about h2{color:#fff;font-size:clamp(28px,4vw,38px);margin-top:14px;}
  .about-copy{margin-top:16px;color:#C9BEA9;font-size:15.5px;line-height:1.7;max-width:480px;}
  .about-quote{
    margin-top:22px;font-family:'Montserrat',sans-serif;font-style:italic;font-size:19px;color:var(--gold-light);
    border-left:3px solid var(--gold);padding-left:14px;
  }
  .mvp{display:flex;flex-direction:column;gap:14px;}
  .mvp-item{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:var(--radius);padding:22px;display:flex;gap:16px;}
  .mvp-icon{width:44px;height:44px;border-radius:11px;background:rgba(203,160,95,.14);display:flex;align-items:center;justify-content:center;flex:none;}
  .mvp-icon svg{width:20px;height:20px;stroke:var(--gold);}
  .mvp-item h3{color:#fff;font-size:17px;font-weight:700;margin-bottom:5px;}
  .mvp-item p{color:#B9AD95;font-size:13.8px;line-height:1.55;}

  /* ---------- Destinations ---------- */
  .destinations{background:var(--sand);}
  .dest-grid{display:grid;grid-template-columns:1fr;gap:18px;}
  @media (min-width:640px){ .dest-grid{grid-template-columns:1fr 1fr;} }
  .dest-card{position:relative;border-radius:var(--radius-lg);overflow:hidden;min-height:280px;display:flex;align-items:flex-end;}
  .dest-card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
  .dest-card::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(16,11,7,0) 30%,rgba(16,11,7,.9) 100%);}
  .dest-info{position:relative;z-index:2;padding:24px;color:#fff;}
  .dest-info .eyebrow{color:var(--gold-light);margin-bottom:8px;}
  .dest-info h3{font-family:'Montserrat',sans-serif;font-size:25px;color:#fff;font-weight:700;}
  .dest-info p{margin-top:6px;font-size:13.5px;color:#DCD2BE;max-width:320px;line-height:1.5;}

  /* ---------- Why travel with us (cream cards, icon circle) ---------- */
  .why{background:var(--cream);}
  .why-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:18px;}
  .why-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius-lg);padding:30px 24px;text-align:center;}
  .why-icon{width:52px;height:52px;border-radius:50%;background:var(--sand-deep);display:flex;align-items:center;justify-content:center;margin:0 auto 18px;}
  .why-icon svg{width:23px;height:23px;stroke:var(--gold-deep);}
  .why-card h3{font-size:16.5px;font-weight:700;font-family:'Montserrat',sans-serif;color:var(--navy);margin-bottom:8px;}
  .why-card p{font-size:13px;color:var(--ink-soft);line-height:1.55;}

  /* ---------- Services ---------- */
  .services{background:var(--navy-soft);color:#fff;}
  .services-grid{display:grid;grid-template-columns:1fr;gap:36px;}
  @media (min-width:880px){ .services-grid{grid-template-columns:.85fr 1.15fr;align-items:center;} }
  .services h2{color:#fff;font-size:clamp(28px,4vw,34px);}
  .services .eyebrow{color:var(--gold);}
  .services-copy{margin-top:14px;color:#C9BEA9;font-size:15px;line-height:1.65;max-width:420px;}
  .services-list{display:grid;grid-template-columns:1fr 1fr;gap:12px 20px;}
  .services-list li{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:700;padding:12px 4px;border-bottom:1px solid rgba(255,255,255,.14);}
  .services-list svg{width:16px;height:16px;stroke:var(--gold);flex:none;}
  @media (max-width:520px){ .services-list{grid-template-columns:1fr;} }

  /* ---------- Testimonials ---------- */
  .testimonials{background:var(--sand-deep);}
  .test-banner{
    display:inline-flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);
    border-radius:var(--radius);padding:16px 22px;margin-bottom:30px;
  }
  .test-banner-dot{width:34px;height:34px;border-radius:50%;background:var(--green);display:flex;align-items:center;justify-content:center;flex:none;}
  .test-banner-dot svg{width:17px;height:17px;stroke:#fff;}
  .test-banner b{display:block;font-family:'Montserrat',sans-serif;font-size:15.5px;color:var(--navy);}
  .test-banner span{font-size:12.5px;color:var(--ink-soft);}
  .test-grid{display:grid;grid-template-columns:1fr;gap:18px;}
  @media (min-width:760px){ .test-grid{grid-template-columns:repeat(3,1fr);} }
  .test-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius-lg);padding:26px;display:flex;flex-direction:column;gap:12px;}
  .test-top{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .test-who{display:flex;align-items:center;gap:10px;}
  .test-avatar{width:40px;height:40px;border-radius:50%;background:var(--gold-deep);color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Montserrat',sans-serif;font-weight:700;font-size:15px;flex:none;}
  .test-name{font-size:14px;font-weight:700;color:var(--navy);}
  .test-role{font-size:11.5px;color:var(--ink-soft);}
  .test-stars{display:flex;gap:2px;}
  .test-stars svg{width:14px;height:14px;fill:var(--green);stroke:none;}
  .test-headline{font-weight:700;color:var(--navy);font-size:15px;}
  .test-quote{font-size:14px;color:var(--ink-soft);line-height:1.6;}
  .test-meta{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:12px;border-top:1px dashed var(--line);font-size:12px;color:var(--ink-soft);}
  .test-verified{display:flex;align-items:center;gap:5px;color:var(--green);font-weight:700;}
  .test-verified svg{width:12px;height:12px;stroke:var(--green);}

  /* ---------- CTA banner ---------- */
  .cta-banner{background:var(--gold);}
  .cta-inner{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:22px;}
  .cta-inner h2{font-size:clamp(24px,3.4vw,32px);color:var(--navy-deep);max-width:480px;}
  .cta-inner p{margin-top:8px;color:#4E3B1D;font-size:14.5px;}
  .cta-actions{display:flex;flex-wrap:wrap;gap:12px;}

  /* ---------- Footer ---------- */
  footer{background:var(--navy-deep);color:#B9AD95;padding-top:64px;}
  .foot-grid{display:grid;grid-template-columns:1fr;gap:36px;}
  @media (min-width:760px){ .foot-grid{grid-template-columns:1.3fr 1fr 1fr 1.1fr;} }
  .foot-brand{margin-bottom:14px;display:flex;align-items:center;gap:10px;}
  .foot-brand .brand-mark{width:34px;height:34px;}
  .foot-brand .b1{font-family:'Montserrat',sans-serif;color:#fff;font-weight:700;font-size:19px;}
  .foot-brand .b1 span{color:var(--gold);}
  .foot-tag{font-size:13.5px;line-height:1.6;max-width:280px;color:#8F836D;}
  .foot-flags{display:flex;gap:8px;margin-top:16px;font-size:20px;}
  footer h4{color:#fff;font-size:12.5px;letter-spacing:2px;margin-bottom:18px;font-family:'Montserrat',sans-serif;}
  footer ul li{margin-bottom:12px;font-size:13.8px;}
  footer ul li a:hover{color:var(--gold);}
  .foot-contact li{display:flex;align-items:flex-start;gap:9px;}
  .foot-contact svg{width:15px;height:15px;stroke:var(--gold);margin-top:2px;flex:none;}
  .foot-extra li a{display:flex;align-items:center;gap:10px;border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:12px 14px;}
  .foot-extra li a:hover{border-color:var(--gold);color:#fff;}
  .foot-extra svg{width:16px;height:16px;stroke:var(--gold);flex:none;}
  .foot-bottom{border-top:1px solid rgba(255,255,255,.08);margin-top:46px;padding:22px 0 26px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;font-size:12.5px;color:#6E6350;}
  .foot-bottom em{color:var(--gold);font-style:normal;font-weight:700;}

  /* ---------- Floating WhatsApp ---------- */
  .wa-float{
    position:fixed;right:18px;bottom:20px;z-index:80;
    width:56px;height:56px;border-radius:50%;background:var(--wa);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 8px 20px rgba(0,0,0,.25);
  }
  .wa-float svg{width:28px;height:28px;fill:#fff;}

  @media (min-width:900px){
    .hero-content .wrap{max-width:660px;}
  }

  /* ---------- Logo animation ---------- */
  .logo-mark{transition:transform .5s cubic-bezier(.34,1.56,.64,1);}
  .brand:hover .logo-mark, .foot-brand:hover .logo-mark{transform:rotate(-8deg) scale(1.08);}
  .logo-sun{animation:sunPulse 3.5s ease-in-out infinite;transform-origin:50px 33px;}
  @keyframes sunPulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.75;transform:scale(1.12);}}

  /* ---------- Hero entrance ---------- */
  .hero-content{animation:heroRise 1s cubic-bezier(.2,.8,.2,1) both;}
  @keyframes heroRise{from{opacity:0;transform:translateY(34px);}to{opacity:1;transform:translateY(0);}}
  .topbar{animation:slideDown .6s ease both;}
  @keyframes slideDown{from{opacity:0;transform:translateY(-100%);}to{opacity:1;transform:translateY(0);}}

  /* ---------- Scroll reveal ---------- */
  .reveal-target{opacity:0;transform:translateY(32px);transition:opacity .7s cubic-bezier(.2,.7,.2,1), transform .7s cubic-bezier(.2,.7,.2,1);}
  .reveal-target.in-view{opacity:1;transform:translateY(0);}

  /* ---------- Hover polish ---------- */
  .pkg-card, .exp-card, .dest-card, .why-card, .test-card{transition:transform .4s ease, box-shadow .4s ease;}
  .pkg-card:hover{transform:translateY(-8px);box-shadow:0 22px 44px rgba(20,15,8,.24);}
  .exp-card:hover{transform:translateY(-6px);}
  .dest-card:hover{transform:translateY(-6px);}
  .why-card:hover{transform:translateY(-6px);box-shadow:0 14px 30px rgba(20,15,8,.1);}
  .test-card:hover{transform:translateY(-6px);box-shadow:0 14px 30px rgba(20,15,8,.1);}
  .pkg-badge{animation:badgeIn .5s ease both;animation-delay:.15s;}
  @keyframes badgeIn{from{opacity:0;transform:translateY(-6px) scale(.9);}to{opacity:1;transform:translateY(0) scale(1);}}
  .btn{transition:transform .25s ease, box-shadow .25s ease, background .15s ease;}
  .btn:hover{transform:translateY(-2px);box-shadow:0 10px 22px rgba(0,0,0,.18);}
  .mvp-item{transition:transform .35s ease, background .35s ease;}
  .mvp-item:hover{transform:translateX(6px);background:rgba(255,255,255,.07);}

  /* ---------- Nav underline ---------- */
  .nav a{position:relative;padding-bottom:3px;}
  .nav a::after{content:"";position:absolute;left:0;bottom:-2px;width:0;height:2px;background:var(--gold);transition:width .3s ease;}
  .nav a:hover::after{width:100%;}

  /* ---------- Filter pill press ---------- */
  .pill{transition:transform .2s ease, background .2s ease, color .2s ease, border-color .2s ease;}
  .pill:active{transform:scale(.95);}

  /* ---------- Floating WhatsApp pulse ---------- */
  .wa-float{animation:waFloatIn .6s ease .4s both;}
  .wa-float::before{
    content:"";position:absolute;inset:0;border-radius:50%;background:var(--wa);
    animation:waPulse 2.2s ease-out infinite;z-index:-1;
  }
  @keyframes waFloatIn{from{opacity:0;transform:scale(0) translateY(20px);}to{opacity:1;transform:scale(1) translateY(0);}}
  @keyframes waPulse{0%{opacity:.55;transform:scale(1);}100%{opacity:0;transform:scale(1.9);}}

  /* ---------- Hero slide caption micro-motion ---------- */
  .hero-pin svg{animation:pinBounce 2.4s ease-in-out infinite;}
  @keyframes pinBounce{0%,100%{transform:translateY(0);}50%{transform:translateY(-3px);}}

  @media (prefers-reduced-motion: reduce){
    .logo-sun, .hero-content, .topbar, .pkg-badge, .wa-float, .wa-float::before, .hero-pin svg{animation:none;}
    .reveal-target{opacity:1;transform:none;transition:none;}
  }

  /* ---------- Cookie consent banner ---------- */
  .cookie-banner{
    position:fixed;left:18px;right:18px;bottom:18px;z-index:120;
    max-width:640px;margin:0 auto;
    background:var(--cream);border:1px solid var(--line);border-radius:var(--radius-lg);
    box-shadow:0 18px 44px rgba(20,15,8,.28);
    padding:20px 22px;
    transform:translateY(140%);opacity:0;
    transition:transform .5s cubic-bezier(.2,.8,.2,1), opacity .5s ease;
    pointer-events:none;
  }
  .cookie-banner.show{transform:translateY(0);opacity:1;pointer-events:auto;}
  .cookie-inner p{font-size:13.5px;line-height:1.6;color:var(--ink-soft);margin-bottom:14px;}
  .cookie-actions{display:flex;flex-wrap:wrap;gap:10px;}
  .cookie-actions .btn{padding:11px 20px;font-size:12.5px;}
  @media (max-width:480px){ .cookie-banner{left:12px;right:12px;bottom:12px;padding:16px 18px;} }

  /* ---------- Scroll progress bar ---------- */
  .scroll-progress{
    position:fixed;top:0;left:0;height:3px;background:linear-gradient(90deg,var(--gold-deep),var(--gold-light));
    width:0%;z-index:150;transition:width .1s linear;
  }

  /* ---------- Animated hero stat counters ---------- */
  .hero-stat b{display:inline-block;}
  .hero-stat.counted b{animation:statPop .5s cubic-bezier(.34,1.56,.64,1) both;}
  @keyframes statPop{from{transform:scale(.85);opacity:.4;}to{transform:scale(1);opacity:1;}}

  /* ---------- Badge shimmer sweep ---------- */
  .pkg-badge{position:absolute;overflow:hidden;}
  .pkg-badge::after{
    content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;
    background:linear-gradient(120deg,transparent,rgba(255,255,255,.55),transparent);
    animation:badgeShimmer 3.2s ease-in-out infinite;
  }
  @keyframes badgeShimmer{0%{left:-60%;}55%{left:130%;}100%{left:130%;}}

  /* ---------- Avatar tilt on hover ---------- */
  .test-avatar{transition:transform .35s cubic-bezier(.34,1.56,.64,1);}
  .test-card:hover .test-avatar{transform:rotate(-8deg) scale(1.08);}

  /* ---------- Icon button micro-bounce ---------- */
  .icon-btn{transition:transform .25s cubic-bezier(.34,1.56,.64,1), background .2s ease;}
  .icon-btn:hover{transform:translateY(-2px) scale(1.05);background:rgba(255,255,255,.12);}

  /* ---------- Filter pill ripple ---------- */
  .pill{position:relative;overflow:hidden;}
  .pill .ripple{
    position:absolute;border-radius:50%;background:rgba(255,255,255,.55);
    transform:scale(0);animation:pillRipple .55s ease-out forwards;pointer-events:none;
  }
  .pill.active .ripple{background:rgba(255,255,255,.35);}
  @keyframes pillRipple{to{transform:scale(2.6);opacity:0;}}

  /* ---------- Floating hero pin drift ---------- */
  .exp-card{position:relative;}
  .exp-card img{will-change:transform;}

  /* ---------- Services icon pulse on hover ---------- */
  .services-list li{transition:transform .25s ease;}
  .services-list li:hover{transform:translateX(6px);}
  .services-list li:hover svg{animation:checkPop .4s ease;}
  @keyframes checkPop{0%{transform:scale(1);}50%{transform:scale(1.35);}100%{transform:scale(1);}}

  @media (prefers-reduced-motion: reduce){
    .pkg-badge::after, .hero-stat.counted b{animation:none;}
  }

  /* ---------- Quick view button + modal (JSON-driven) ---------- */
  .pkg-quickview{
    align-self:flex-start;background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.4);
    border-radius:99px;padding:8px 16px;font-size:11.5px;font-weight:700;letter-spacing:.5px;
    cursor:pointer;margin-top:2px;transition:background .2s ease, transform .2s ease;
  }
  .pkg-quickview:hover{background:rgba(255,255,255,.28);transform:translateY(-1px);}

  .modal-overlay{
    position:fixed;inset:0;z-index:200;background:rgba(16,11,7,.6);backdrop-filter:blur(2px);
    display:flex;align-items:center;justify-content:center;padding:20px;
    opacity:0;pointer-events:none;transition:opacity .3s ease;
  }
  .modal-overlay.open{opacity:1;pointer-events:auto;}
  .modal-card{
    background:#fff;border-radius:var(--radius-lg);max-width:520px;width:100%;max-height:88vh;overflow-y:auto;
    transform:translateY(24px) scale(.97);opacity:0;transition:transform .35s cubic-bezier(.2,.8,.2,1), opacity .35s ease;
    box-shadow:0 30px 70px rgba(0,0,0,.35);
  }
  .modal-overlay.open .modal-card{transform:translateY(0) scale(1);opacity:1;}
  .modal-img{width:100%;height:220px;object-fit:cover;border-radius:var(--radius-lg) var(--radius-lg) 0 0;}
  .modal-body{padding:24px;}
  .modal-badge{display:inline-block;background:var(--sand-deep);color:var(--gold-deep);font-size:11px;font-weight:800;padding:6px 12px;border-radius:99px;margin-bottom:10px;}
  .modal-loc{font-size:12px;color:var(--ink-soft);font-weight:700;letter-spacing:1px;margin-bottom:6px;}
  .modal-title{font-size:24px;color:var(--navy);margin-bottom:12px;}
  .modal-includes{font-size:14px;color:var(--ink-soft);line-height:1.6;margin-bottom:16px;}
  .modal-meta{display:flex;justify-content:space-between;align-items:center;padding-top:14px;border-top:1px solid var(--line);margin-bottom:18px;}
  .modal-duration{font-size:12.5px;font-weight:700;color:var(--ink-soft);letter-spacing:.5px;}
  .modal-price{font-size:20px;font-weight:700;color:var(--gold-deep);}
  .modal-actions{display:flex;gap:10px;flex-wrap:wrap;}
  .modal-close{
    position:absolute;top:14px;right:14px;width:36px;height:36px;border-radius:50%;
    background:rgba(0,0,0,.45);border:none;color:#fff;font-size:18px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  .modal-close:hover{background:rgba(0,0,0,.65);}
  .modal-media{position:relative;}
</style>
</head>
